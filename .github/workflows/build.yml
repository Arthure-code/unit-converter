name: SonarQube
on:
  push:
    branches:
      - main
  pull_request:
    types: [opened, synchronize, reopened]
jobs:
  build:
    name: Build and analyze
    runs-on: windows-latest
    steps:
      - name: Set up JDK 21
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6 # v6.0.1
        with:
          java-version: 21
          distribution: 'zulu'
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0  # Shallow clones should be disabled for a better relevancy of analysis
      - name: Cache SonarQube Cloud packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~\sonar\cache
          key: ${{ runner.os }}-sonar
          restore-keys: ${{ runner.os }}-sonar
      - name: Cache SonarQube Cloud scanner
        id: cache-sonar-scanner
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ${{ runner.temp }}\scanner
          key: ${{ runner.os }}-sonar-scanner
          restore-keys: ${{ runner.os }}-sonar-scanner
      - name: Install SonarQube Cloud scanner
        if: steps.cache-sonar-scanner.outputs.cache-hit != 'true'
        shell: powershell
        run: |
          New-Item -Path ${{ runner.temp }}\scanner -ItemType Directory
          dotnet tool update dotnet-sonarscanner --tool-path ${{ runner.temp }}\scanner
      - name: Set up .NET 9
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          dotnet-version: 9.0.x

      - name: Install the MAUI workloads
        shell: pwsh
        run: dotnet workload install maui-android maui-windows --skip-sign-check

      - name: Build and analyze
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        shell: pwsh
        run: |
          # Sans ces deux lignes, seule la derniere commande decide du sort
          # de l'etape : des tests en echec passeraient inapercus.
          $ErrorActionPreference = "Stop"
          $PSNativeCommandUseErrorActionPreference = $true
          # La solution porte la bibliotheque de conversion, l'application
          # MAUI et les tests : elle couvre tout le depot.
          # L'amorçage de MAUI, la classe Application, le Shell, MauiProgram
          # et les points d'entree par plateforme, ne s'execute qu'avec un
          # ecran : aucun test unitaire ne l'atteint, et le compter revient
          # a mesurer ce qui n'est pas mesurable. Il sort de la couverture,
          # pas de l'analyse : ses regles et ses vulnerabilites restent
          # verifiees.
          ${{ runner.temp }}\scanner\dotnet-sonarscanner begin /k:"Arthure-code_unit-converter" /o:"arthuredevsecops" /d:sonar.token="$env:SONAR_TOKEN" /d:sonar.cs.cobertura.reportsPaths="**/coverage.cobertura.xml" /d:sonar.coverage.exclusions="src/UnitConverter.App/App.xaml.cs,src/UnitConverter.App/AppShell.xaml.cs,src/UnitConverter.App/MauiProgram.cs,src/UnitConverter.App/Platforms/**"
          dotnet build UnitConverter.sln
          dotnet test UnitConverter.sln --no-build --collect:"XPlat Code Coverage"
          # Une dependance vulnerable arrete la chaine plutot que de
          # passer inapercue dans le journal.
          $vulnerables = dotnet list UnitConverter.sln package --vulnerable --include-transitive
          $vulnerables
          if ($vulnerables -match "has the following vulnerable packages") {
              throw "Des paquets vulnerables ont ete trouves."
          }
          ${{ runner.temp }}\scanner\dotnet-sonarscanner end /d:sonar.token="$env:SONAR_TOKEN"
